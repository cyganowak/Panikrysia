# Stałe reguły pulpitów dla programów, które otwierają najpierw okienko startowe
# (Steam, gry ze Steama). Dopisać do konfiguracji Hyprlanda w Omarchy,
# np. ~/.config/hypr/hyprland.conf albo pliku, który on dołącza.
#
# Klasę okna sprawdzisz poleceniem: hyprctl clients   (pole "class")
# TODO: składnię reguł sprawdzić dla Twojej wersji Hyprlanda (hyprctl version),
#       bo zmieniała się między wydaniami.

windowrulev2 = workspace 5 silent, class:^(steam)$
windowrulev2 = workspace 5 silent, class:^(steam_app_.*)$   # gry uruchomione ze Steama
